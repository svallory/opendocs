type: 'library'
language: 'polyglot'

project:
  name: 'opendocs-model'
  description: 'OpenDocs model libraries for multiple languages'

tasks:
  # Build all language implementations
  build:
    deps:
      - '~:build'

  # Run tests for all languages
  test:
    deps:
      - '~:test'

  # Format code
  format:
    deps:
      - '~:format'

  # Lint code
  lint:
    deps:
      - '~:lint'

  # Clean all build artifacts
  clean:
    deps:
      - '~:clean'